bio:
  - >-
    Keyu Li (李克钰), second-year Ph.D. student at
    <a href="https://www.sjtu.edu.cn/">Shanghai Jiao Tong University</a> and
    <a href="https://www.sii.edu.cn/">Shanghai Innovation Institute</a>, advised by
    <a href="https://scholar.google.com/citations?user=OZ7PjVoAAAAJ">Dequan Wang</a> and
    <a href="https://scholar.google.com/citations?user=oIz_CYEAAAAJ">Pengfei Liu</a>.
    Working on LLM continual pre-training &amp; mid-training, agentic RL,
    multi-agent systems, and frontier AI evaluation.
  - >-
    <span class="mark">Now a research intern at Tencent Youtu Lab</span>, building CPT / mid-training data
    and RL recipes for coding agents. Previously at GAIR Lab, where I led
    <a href="#agencybench">AgencyBench</a> and <a href="#datasetresearch">DatasetResearch</a>.
    Heavy daily user of Claude Code and Codex.

